# Render Blueprint - deploys the whole stack as separate free Web Services, with the gateway
# service replicating docker-compose's single-origin routing (see gateway/nginx.render.conf.template).
#
# MANUAL STEP AFTER FIRST SYNC: render.yaml has no field for a service to reference an
# envVarGroup (confirmed against Render's docs - the service schema genuinely doesn't have
# one). The shadow-listens-shared group below still needs to be linked to each of auth,
# catalogue, stream, worker, events, and recommender by hand: open each service -> Environment
# tab -> "Linked Environment Groups" -> select shadow-listens-shared -> Link. One-time, six
# clicks total; it's not something a render.yaml edit can do.
#
# STILL UNVERIFIED: the AUTH_UPSTREAM/CATALOGUE_UPSTREAM/STREAM_UPSTREAM/FRONTEND_UPSTREAM
# values below assume Render's internal service address is "http://<service-name>:<port>".
# The gateway resolves these lazily per-request (not at startup - see
# nginx.render.conf.template), so a wrong hostname shows up as 502s on specific routes rather
# than the whole service crash-looping. If that happens, check each backend service's
# "Internal Address" in the Render dashboard and fix these values to match.
#
# First-deploy order: deploy `shadow-listens-auth` alone first (it runs the DB migration at
# startup - see services/auth/Dockerfile.render) and wait for it to go live, THEN deploy the
# rest. Redeploys after that are safe in any order (migrations are idempotent).
#
# Secrets (marked sync: false) are never written here - set their real values in the Render
# dashboard after creating each service. Generated secrets (JWT_SECRET, STREAM_SIGNING_SECRET)
# are created automatically by Render on first deploy.

envVarGroups:
  - name: shadow-listens-shared
    envVars:
      - key: DATABASE_URL        # from Neon or Supabase - postgresql+psycopg2://...
        sync: false
      - key: REDIS_URL           # from Upstash - rediss://...
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STREAM_SIGNING_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: CORS_ORIGINS        # your real public domain, once you have one (no trailing slash)
        sync: false
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: HLS_AUDIO_CODEC
        value: "aac"
      - key: S3_ENDPOINT_URL
        value: https://s3.eu-central-003.backblazeb2.com
      - key: S3_REGION
        value: eu-central-003
      - key: S3_BUCKET_AUDIO
        value: Shadow-listens-audio
      - key: S3_BUCKET_COVERS
        value: Shadow-listens-covers
      - key: S3_ACCESS_KEY       # your B2 Application Key ID - already in your local .env
        sync: false
      - key: S3_SECRET_KEY       # your B2 Application Key secret - already in your local .env
        sync: false

services:
  - type: web
    name: shadow-listens-auth
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./services/auth/Dockerfile.render
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"

  - type: web
    name: shadow-listens-catalogue
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./services/catalogue/Dockerfile.render
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"

  - type: web
    name: shadow-listens-stream
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./services/stream/Dockerfile.render
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"

  - type: web
    name: shadow-listens-worker
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./services/worker/Dockerfile.render
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"

  - type: web
    name: shadow-listens-events
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./services/events/Dockerfile.render
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"

  - type: web
    name: shadow-listens-recommender
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./services/recommender/Dockerfile.render
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"

  - type: web
    name: shadow-listens-frontend
    runtime: docker
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: PORT
        value: "3000"

  - type: web
    name: shadow-listens-gateway
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./gateway/Dockerfile.render
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: AUTH_UPSTREAM
        value: http://shadow-listens-auth:8000
      - key: CATALOGUE_UPSTREAM
        value: http://shadow-listens-catalogue:8000
      - key: STREAM_UPSTREAM
        value: http://shadow-listens-stream:8000
      - key: FRONTEND_UPSTREAM
        value: http://shadow-listens-frontend:3000
