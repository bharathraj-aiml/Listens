[project]
name = "listens-common"
version = "0.1.0"
description = "Shared config, DB models and security helpers for Shadow Listens services"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "redis>=5"]
storage = ["boto3>=1.34"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["listens_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
