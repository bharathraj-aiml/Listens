# Pokes the HTTP-triggered worker/events/recommender services (see services/*/app/http.py)
# since Render's free tier can't run them as a persistent loop the way docker-compose does.
# As a side effect, the frequent pings also keep worker/events from going to sleep on Render's
# free tier (idle web services sleep after ~15 min and take 30-60s to wake on the next request).
#
# GitHub Actions schedules are "best effort" and the platform doesn't allow more than once every
# 5 minutes, so that's the floor here - a real backlog may take a few ticks to fully drain.
#
# The three service URLs are public (not secrets), so they're written inline below - no
# repo secrets needed. If a service is renamed or moved, update them here.
name: Tick background services

on:
  schedule:
    - cron: "*/5 * * * *"  # worker + events
    - cron: "0 3 * * *"    # recommender, once daily
  workflow_dispatch: {}

jobs:
  tick-worker-and-events:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Tick worker (drain transcode queue)
        run: curl -fsS --max-time 300 -X POST "https://shadow-listens-worker.onrender.com/tick?max_seconds=240"
      - name: Tick events (drain play-event queue)
        run: curl -fsS --max-time 120 -X POST "https://shadow-listens-events.onrender.com/tick?max_seconds=25"

  tick-recommender:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Tick recommender (retrain ALS model)
        run: curl -fsS --max-time 600 -X POST "https://shadow-listens-recommender.onrender.com/tick"
