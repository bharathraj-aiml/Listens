# Pokes the HTTP-triggered worker/events/recommender services (see services/*/app/http.py)
# since Render's free tier can't run them as a persistent loop the way docker-compose does.
#
# Deliberately infrequent: Render's free plan gives the whole workspace 750 instance-hours a month,
# and a service is "awake" for ~15 min after every request. Pinging worker + events every few
# minutes kept both awake 24/7 (~1,460 h/month) and would get ALL services suspended mid-month.
# At these rates they cost roughly 55 h/month in total, leaving the rest for playback. Fast
# transcoding is done by the local laptop worker (scripts/run_local_worker.sh); this is the
# slow fallback. Run the workflow manually (Actions tab -> Run workflow) to drain sooner.
#
# The service URLs are public (not secrets), so they're written inline below - no repo secrets
# needed. If a service is renamed or moved, update them here.
#
# warm-front-services (below) is a SEPARATE, manual-only job: it pings the 5 user-facing
# services (gateway, frontend, auth, catalogue, stream) that this schedule otherwise never
# touches, so they're as free as the three above to fall fully asleep after ~15 min idle. That's
# deliberate - keeping all 5 warm on any kind of recurring schedule costs roughly 730 h/month
# *per service* if pinged often enough to never let them sleep (since Render only charges while
# a free-tier instance is actually awake), which for 5 services alone blows past the whole
# workspace's 750 h/month cap even before the ~55 h/month above. Run this manually (Actions tab
# -> Run workflow, tick "warm_front_services") a minute or two before sharing the live link with
# someone, so they don't hit a ~10-30s cold start on the first request. A visitor who stumbles on
# the link unprompted will still see a cold start - there's no free-tier way around that with 8
# separate services.
name: Tick background services

on:
  schedule:
    - cron: "0 */6 * * *"  # worker, every 6 hours (UTC)
    - cron: "50 2 * * *"   # events, daily, just before the recommender
    - cron: "0 3 * * *"    # recommender, daily
  workflow_dispatch: {}

# Never let two runs overlap: a real song can take minutes on Render's free-tier CPU, and a
# second concurrent transcode on a 512MB instance risks running out of memory.
concurrency:
  group: tick-background-services
  cancel-in-progress: false

jobs:
  tick-worker:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Tick worker (drain transcode queue)
        run: curl -fsS --max-time 300 -X POST "https://shadow-listens-worker.onrender.com/tick?max_seconds=240"

  tick-events:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '50 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Tick events (drain play-event queue)
        run: curl -fsS --max-time 120 -X POST "https://shadow-listens-events.onrender.com/tick?max_seconds=25"

  tick-recommender:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Tick recommender (retrain ALS model)
        run: curl -fsS --max-time 600 -X POST "https://shadow-listens-recommender.onrender.com/tick"

  warm-front-services:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Wake frontend, auth, catalogue, stream, gateway
        run: |
          for url in \
            https://shadow-listens-frontend.onrender.com/ \
            https://shadow-listens-auth.onrender.com/health \
            https://shadow-listens-catalogue.onrender.com/health \
            https://shadow-listens-stream.onrender.com/health \
            https://shadow-listens-gateway.onrender.com/healthz; do
            curl -fsS -o /dev/null --max-time 120 --retry 2 --retry-delay 5 "$url" &
          done
          wait
