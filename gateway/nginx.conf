# API gateway: single entry point; each service gets a path prefix.
# Later phases add upstreams (catalogue, library, events, ...) here.
worker_processes auto;
events { worker_connections 1024; }

http {
  # Docker's embedded DNS; re-resolve so a restarted service doesn't break the gateway.
  resolver 127.0.0.11 valid=10s ipv6=off;

  log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  server_tokens off;
  client_max_body_size 1m;   # raised on the upload route in Phase 2

  server {
    listen 80;

    location = /healthz { return 200 "ok\n"; }

    location /api/auth/ {
      set $auth_upstream http://auth:8000;
      # Strip /api/auth so the service sees /register, /login, ...
      rewrite ^/api/auth/(.*)$ /$1 break;
      proxy_pass $auth_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
