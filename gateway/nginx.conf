# API gateway: single public entry point. Same origin for web app + API => no CORS needed in the browser.
#   /api/auth/*       -> auth service
#   /api/catalogue/*  -> catalogue service (tracks, upload, search)
#   /api/stream/*     -> stream service (signed HLS + covers)
#   /*                -> Next.js web app
worker_processes auto;
events { worker_connections 1024; }

http {
  # Docker's embedded DNS; re-resolve so a restarted service doesn't break the gateway.
  resolver 127.0.0.11 valid=10s ipv6=off;

  log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  server_tokens off;
  client_max_body_size 1m;   # everything except uploads (below)

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;

    # Inherited by every location below that doesn't set its own proxy_set_header.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz { return 200 "ok\n"; }

    location /api/auth/ {
      set $up http://auth:8000;
      rewrite ^/api/auth/(.*)$ /$1 break;   # service sees /login, /register, ...
      proxy_pass $up;
    }

    # Uploads: large bodies, streamed straight through (no buffering to disk at the gateway).
    location = /api/catalogue/upload {
      set $up http://catalogue:8000;
      rewrite ^/api/catalogue/(.*)$ /$1 break;
      client_max_body_size 600m;
      proxy_request_buffering off;
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;
      proxy_pass $up;
    }

    location /api/catalogue/ {
      set $up http://catalogue:8000;
      rewrite ^/api/catalogue/(.*)$ /$1 break;
      proxy_pass $up;
    }

    location /api/stream/ {
      set $up http://stream:8000;
      rewrite ^/api/stream/(.*)$ /$1 break;
      proxy_pass $up;
    }

    location / {
      set $up http://frontend:3000;
      proxy_pass $up;
      # (re-declare the common headers: setting any proxy_set_header here stops inheritance)
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
