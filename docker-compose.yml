# Shadow Listens stack: data stores, migrations, auth/catalogue/stream/worker/events, web app, gateway.
# Object storage is Backblaze B2 (S3-compatible API) - not run as a compose service, so fill in
# the real S3_* values in .env before starting (see .env.example).
# Start: cp .env.example .env && docker compose up --build
name: shadow-listens

x-python-env: &python-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  JWT_SECRET: ${JWT_SECRET}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  CORS_ORIGINS: ${CORS_ORIGINS}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET_AUDIO: ${S3_BUCKET_AUDIO}
  S3_BUCKET_COVERS: ${S3_BUCKET_COVERS}
  STREAM_SIGNING_SECRET: ${STREAM_SIGNING_SECRET}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
  HLS_AUDIO_CODEC: ${HLS_AUDIO_CODEC:-aac}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: apply Alembic migrations, then exit. Services wait for it.
  migrate:
    build:
      context: .
      dockerfile: migrations/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment: *python-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  catalogue:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/catalogue/Dockerfile
    environment: *python-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  stream:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/stream/Dockerfile
    environment: *python-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Background transcoder: Redis Stream jobs -> FFmpeg -> HLS in B2. Scale with `--scale worker=N`.
  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment: *python-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Consumes jobs:events (play_start/play_end/skip/like/add_to_playlist) -> play_events rows.
  # Scale with `--scale events=N` the same way as the transcode worker.
  events:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/events/Dockerfile
    environment: *python-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Nightly-ish ALS training (see services/recommender/app/train.py): reads play_events/likes/
  # playlist_tracks straight from Postgres and writes user_vectors/track_vectors. No Redis
  # stream and no object storage needed - it's a scheduled batch job over the DB, not a request handler.
  recommender:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/recommender/Dockerfile
    environment:
      <<: *python-env
      RECOMMENDER_TRAIN_INTERVAL_HOURS: ${RECOMMENDER_TRAIN_INTERVAL_HOURS:-24}
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    depends_on:
      - auth

  gateway:
    restart: unless-stopped
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth:
        condition: service_healthy
      catalogue:
        condition: service_healthy
      stream:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  pgdata:
  redisdata:
