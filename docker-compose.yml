# Shadow Listens - Phase 2 stack: data stores, migrations, auth/catalogue/stream/worker, web app, gateway.
# Start: cp .env.example .env && docker compose up --build
name: shadow-listens

x-python-env: &python-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  JWT_SECRET: ${JWT_SECRET}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  CORS_ORIGINS: ${CORS_ORIGINS}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET_AUDIO: ${S3_BUCKET_AUDIO}
  S3_BUCKET_COVERS: ${S3_BUCKET_COVERS}
  STREAM_SIGNING_SECRET: ${STREAM_SIGNING_SECRET}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
  HLS_AUDIO_CODEC: ${HLS_AUDIO_CODEC:-aac}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9001:9001"   # web console (dev only)
    volumes:
      - miniodata:/data

  # One-shot: create the buckets Phase 2 will use. Private by default.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    # MinIO needs a few seconds to boot: retry until it answers, then create the buckets.
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do echo 'waiting for minio...'; sleep 2; done &&
      mc mb --ignore-existing local/${S3_BUCKET_AUDIO} &&
      mc mb --ignore-existing local/${S3_BUCKET_COVERS} &&
      echo 'buckets ready'"
    restart: "no"

  # One-shot: apply Alembic migrations, then exit. Services wait for it.
  migrate:
    build:
      context: .
      dockerfile: migrations/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment: *python-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  catalogue:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/catalogue/Dockerfile
    environment: *python-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  stream:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/stream/Dockerfile
    environment: *python-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Background transcoder: Redis Stream jobs -> FFmpeg -> HLS in MinIO. Scale with `--scale worker=N`.
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment: *python-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    depends_on:
      - auth

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth:
        condition: service_healthy
      catalogue:
        condition: service_healthy
      stream:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  miniodata:
